version: '3.8'

services:
  pan-transfer-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: pan-transfer-bot:latest
    container_name: pan-transfer-bot
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    env_file:
      - .env
    volumes:
      # 持久化存储用户网页端保存的 settings.json（如不存在将自动生成）
      - ./settings.json:/app/settings.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
